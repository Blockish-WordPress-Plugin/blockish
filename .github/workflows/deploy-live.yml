name: Deploy to Live Site

on:
  workflow_run:
    workflows: ["Deploy to WordPress.org"]
    types:
      - completed
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Build & Deploy via FTP
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Extract zip for clean deployment
        run: unzip blockish.zip -d ./dist/

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/blockish/
          server-dir: /wp-content/plugins/blockish/
